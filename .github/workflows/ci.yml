name: CI

# Runs on every pull request (no path filter) so the jobs can be made required
# status checks with branch protection. Deploys stay in deploy-api.yml / deploy-web.yml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, format, image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore api/BrokerPulse.Api.slnx

      # api/AGENTS.md: "Do not suppress warnings — fix them."
      - name: Build (warnings as errors)
        run: dotnet build api/BrokerPulse.Api.slnx --no-restore -c Release -warnaserror

      - name: Format check
        run: dotnet format api/BrokerPulse.Api.slnx --no-restore --verify-no-changes

      # No tests exist yet. When a test project is added, add `dotnet test` here.

      - name: Build container image (no push)
        run: docker build -t brokerpulse-api:ci ./api

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      # No test framework or `astro check` is configured yet. Add them here when they exist.
