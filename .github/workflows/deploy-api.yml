name: Deploy API

# Called from ci.yml only after the CI jobs pass on main. workflow_dispatch is a
# deliberate manual override (redeploy without CI); it needs write access to the repo.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RESOURCE_GROUP: brokerpulse-rg
  CONTAINER_APP: brokerpulse-api
  ACR_NAME: brokerpulseacr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/brokerpulse-api:${{ github.sha }}"
          docker build -t "$IMAGE" ./api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Traffic stays pinned to one revision (multi-revision mode), so the update below
      # creates the new revision with 0% traffic. Production is untouched until the
      # new revision has proven healthy.
      - name: Deploy new revision (0% traffic)
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          REVISION=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName -o tsv)
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "New revision: $REVISION"

      # Every revision has its own FQDN, reachable even with 0% traffic. The window covers
      # a cold start from scale-to-zero (~25 s measured).
      - name: Verify new revision /health
        run: |
          # Guard: the revision must actually run the image we just built.
          REV_IMAGE=$(az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION" \
            --query "properties.template.containers[0].image" -o tsv)
          if [ "$REV_IMAGE" != "$IMAGE" ]; then
            echo "::error::Revision $REVISION runs $REV_IMAGE, expected $IMAGE"
            exit 1
          fi
          REV_FQDN=$(az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION" \
            --query properties.fqdn -o tsv)
          echo "Checking https://$REV_FQDN/health"
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 5 --retry-all-errors \
            "https://$REV_FQDN/health"

      - name: Shift traffic to new revision
        run: |
          az containerapp ingress traffic set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$REVISION=100" \
            --output none

      - name: Verify public /health after shift
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors \
            "https://$FQDN/health"

      # Keep the newest revisions as rollback targets; deactivate the rest. Never touches
      # the revision that holds traffic. Best effort: a cleanup problem must not fail a deploy.
      - name: Deactivate old revisions (keep 5)
        continue-on-error: true
        run: |
          KEEP=5
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([?properties.active], &properties.createdTime)[].name" -o tsv \
            | head -n -"$KEEP" \
            | while read -r rev; do
                [ "$rev" = "$REVISION" ] && continue
                echo "Deactivating $rev"
                az containerapp revision deactivate \
                  --name "$CONTAINER_APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --revision "$rev" --output none
              done

      # On failure: leave production alone (traffic was never shifted, or the shift is what
      # failed) and print what a human or agent needs to diagnose it.
      - name: Diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "=== traffic ==="
          az containerapp ingress traffic show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" -o table
          echo "=== revisions ==="
          az containerapp revision list \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,traffic:properties.trafficWeight,health:properties.healthState,state:properties.runningState}" -o table
          if [ -n "${REVISION:-}" ]; then
            echo "=== last logs of $REVISION ==="
            az containerapp logs show \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" --tail 50 --format text || true
          fi
